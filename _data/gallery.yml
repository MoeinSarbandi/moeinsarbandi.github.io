      title: Nonlinear and Data-Driven Model Predictive Control
      location: CentraleSupélec, Paris-Saclay, France
      role: Participant
      description: An EECI graduate course led by Prof. Frank Allgöwer and Prof. Matthias A. Müller, covering nonlinear, economic, robust, and data-driven model predictive control.
