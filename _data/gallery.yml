      category: Conference
      title: 23rd IFAC World Congress
      location: Busan, Republic of Korea
      role: Presenter and reviewer
      description: Presented “Robust Control Based on a New Wind Speed Observer for Floating Wind Turbines” and took part in the international automatic-control community’s flagship congress.
