    - id: vss-exeter
      date: July 27–30, 2026
      category: Workshop
      title: 18th International Workshop on Variable Structure Systems
      location: University of Exeter, United Kingdom
      role: Research contributor
      description: Joint research on robust sliding-mode control for floating wind turbines was highlighted by Prof. Antonella Ferrara during a plenary session.
      url: https://engineering.exeter.ac.uk/events/variablestructuresystems/
      url_label: Workshop website
      photos:
        - path: assets/img/gallery/2026-vss-exeter/plenary.webp
          width: 675
          height: 1200
          alt: Prof. Antonella Ferrara presenting joint floating-wind-turbine control research at VSS 2026

    - id: torque-bruges
      date: June 2–5, 2026
      category: Conference
      title: TORQUE 2026
      location: Bruges, Belgium
      role: Presenter
      description: Presented work on control-Lyapunov-function-based quadratic programming and adaptive super-twisting control for floating offshore wind turbines.
      url: https://torque2026.eu/
      url_label: Conference website
      photos:
        - path: assets/img/gallery/2026-torque-bruges/presentation.webp
          width: 800
          height: 1066
          alt: Moein Sarbandi presenting floating offshore wind turbine control research at TORQUE 2026

